<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Guitar strings hint -->
  <g opacity="0.05">
    <line x1="50" y1="100" x2="350" y2="100" stroke="#22c55e" stroke-width="1"/>
    <line x1="50" y1="120" x2="350" y2="120" stroke="#22c55e" stroke-width="1.5"/>
    <line x1="50" y1="140" x2="350" y2="140" stroke="#22c55e" stroke-width="2"/>
    <line x1="50" y1="160" x2="350" y2="160" stroke="#22c55e" stroke-width="2"/>
    <line x1="50" y1="180" x2="350" y2="180" stroke="#22c55e" stroke-width="1.5"/>
    <line x1="50" y1="200" x2="350" y2="200" stroke="#22c55e" stroke-width="1"/>
  </g>
  <!-- Center icon -->
  <circle cx="200" cy="150" r="45" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.2"/>
  <text x="200" y="163" font-family="system-ui, sans-serif" font-size="38" fill="url(#accent)" text-anchor="middle" opacity="0.6">🎸</text>
  <!-- Label -->
  <text x="200" y="235" font-family="system-ui, sans-serif" font-size="14" fill="#8b949e" text-anchor="middle" letter-spacing="2">INSTRUMENT</text>
</svg>
