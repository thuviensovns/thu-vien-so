name = "yt-proxy"
main = "src/index.js"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Free tier is enough for a personal site. 100k req/day.
# workers_dev = true gives a free *.workers.dev URL automatically.
workers_dev = true

# ---
# PROXY_SECRET is set via:   wrangler secret put PROXY_SECRET
# (do NOT put it here — secrets must be encrypted)
