      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <!-- Icon box -->
  <rect x="1" y="5" width="38" height="38" rx="10" fill="#ffffff"/>
  <rect x="1" y="5" width="38" height="38" rx="10" fill="url(#iconGrad)" opacity="0.08"/>
  <rect x="1.5" y="5.5" width="37" height="37" rx="9.5" stroke="url(#borderGrad)" stroke-width="1"/>
