  <!-- Text -->
  <text x="48" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#1a1a2e" letter-spacing="-0.3">Thư Viện</text>
  <text x="148" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0891b2" letter-spacing="-0.3">Số</text>
