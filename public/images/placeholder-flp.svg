  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Piano keys hint -->
  <g opacity="0.06">
    <rect x="120" y="200" width="20" height="60" rx="2" fill="#ffffff"/>
    <rect x="145" y="200" width="20" height="60" rx="2" fill="#ffffff"/>
    <rect x="170" y="200" width="20" height="60" rx="2" fill="#ffffff"/>
    <rect x="195" y="200" width="20" height="60" rx="2" fill="#ffffff"/>
    <rect x="220" y="200" width="20" height="60" rx="2" fill="#ffffff"/>
    <rect x="245" y="200" width="20" height="60" rx="2" fill="#ffffff"/>
    <rect x="270" y="200" width="20" height="60" rx="2" fill="#ffffff"/>
    <rect x="133" y="200" width="14" height="38" rx="2" fill="#f97316" opacity="0.5"/>
    <rect x="158" y="200" width="14" height="38" rx="2" fill="#f97316" opacity="0.5"/>
    <rect x="208" y="200" width="14" height="38" rx="2" fill="#f97316" opacity="0.5"/>
    <rect x="233" y="200" width="14" height="38" rx="2" fill="#f97316" opacity="0.5"/>
